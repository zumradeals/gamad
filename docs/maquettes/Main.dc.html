<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fil global — téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A5FA3}a:hover{color:#08487A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1800px; box-sizing: border-box; background: #F5F3EE; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E2A3F; display: flex; flex-direction: column">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">GAMAD</span>
<span style="font-size: 11px; color: #4A5B68; font-weight: 500">Des personnes. Des actions. Un impact réel.</span>
</div>
<div style="display: flex; gap: 4px">
<button aria-label="Rechercher" style="width: 44px; height: 44px; border: none; background: transparent; color: #0E2A3F; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button aria-label="Notifications" style="width: 44px; height: 44px; border: none; background: transparent; color: #0E2A3F; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg></button>
</div>
</header>

<main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">

<section aria-label="Publier" style="background: #FFFFFF; border: 1px solid #E3E0D8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 10px; align-items: center">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #0E2A3F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0">K</span>
<button style="flex: 1; height: 44px; border: 1px solid #E3E0D8; background: #F5F3EE; border-radius: 999px; text-align: left; padding: 0 16px; font-size: 14px; color: #4A5B68">Que voulez-vous faire avancer ?</button>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #FCE9D9; color: #8A3B00; font-size: 13px; font-weight: 700">J'ai besoin</button>
<button style="height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #DDF1E4; color: #1B5E33; font-size: 13px; font-weight: 700">Je partage un savoir</button>
<button style="height: 36px; padding: 0 12px; border-radius: 999px; border: none; background: #DCEBF8; color: #0A4C85; font-size: 13px; font-weight: 700">Je veux apprendre</button>
</div>
</section>

<nav aria-label="Filtrer le Fil" style="display: flex; gap: 8px; overflow-x: auto; padding: 2px 0">
<button style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #0E2A3F; color: #FFFFFF; font-size: 13px; font-weight: 700; flex-shrink: 0">Tout</button>
<button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D1C7; background: #FFFFFF; color: #0E2A3F; font-size: 13px; font-weight: 600; flex-shrink: 0">Besoins</button>
<button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D1C7; background: #FFFFFF; color: #0E2A3F; font-size: 13px; font-weight: 600; flex-shrink: 0">Savoirs</button>
<button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D1C7; background: #FFFFFF; color: #0E2A3F; font-size: 13px; font-weight: 600; flex-shrink: 0">Projets</button>
<button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D1C7; background: #FFFFFF; color: #0E2A3F; font-size: 13px; font-weight: 600; flex-shrink: 0">ZUMRA</button>
</nav>

<sc-for list="{{posts}}" as="p" hint-placeholder-count="5">
<article style="background: #FFFFFF; border: 1px solid #E3E0D8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: flex-start; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">{{p.badge}}</span>
<div style="display: flex; gap: 10px; align-items: center">
<span style="width: 40px; height: 40px; border-radius: {{p.avatarRadius}}; background: {{p.avatarBg}}; color: {{p.avatarFg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0">{{p.initials}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
<a href="#" style="font-weight: 700; font-size: 15px; color: #0E2A3F; text-decoration: none">{{p.author}}</a>
<sc-if value="{{p.verified}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #1B5E33"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Reconnue</span>
</sc-if>
</div>
<span style="font-size: 12px; color: #4A5B68">{{p.meta}}</span>
</div>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.5">{{p.text}}</p>
<sc-if value="{{p.hasContext}}" hint-placeholder-val="{{false}}">
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">{{p.context}}</a>
</sc-if>
<sc-if value="{{p.hasFact}}" hint-placeholder-val="{{false}}">
<span style="font-size: 13px; color: #4A5B68; font-weight: 600">{{p.fact}}</span>
</sc-if>
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #0E2A3F; color: #FFFFFF; font-size: 14px; font-weight: 700">{{p.primary}}</button>
<sc-if value="{{p.hasSecondary}}" hint-placeholder-val="{{false}}">
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #0E2A3F; background: #FFFFFF; color: #0E2A3F; font-size: 14px; font-weight: 700">{{p.secondary}}</button>
</sc-if>
</div>
<div style="display: flex; gap: 4px; border-top: 1px solid #EEEBE4; padding-top: 6px">
<button style="height: 40px; padding: 0 10px; border: none; background: transparent; color: #4A5B68; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg>Commenter</button>
<button style="height: 40px; padding: 0 10px; border: none; background: transparent; color: #4A5B68; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v12M8 7l4-4 4 4"></path></svg>Partager</button>
<button aria-label="Signaler" style="height: 40px; width: 44px; margin-left: auto; border: none; background: transparent; color: #4A5B68; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg></button>
</div>
</article>
</sc-for>

</main>

<nav aria-label="Navigation principale" style="background: #FFFFFF; border-top: 1px solid #E3E0D8; height: 76px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0E2A3F; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Fil</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #4A5B68; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Découvrir</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0E2A3F; text-decoration: none"><span style="width: 48px; height: 48px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-top: -18px; border: 3px solid #FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Agir</a>
<a href="Carrefour-ZUMRA.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #4A5B68; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>ZUMRA</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #4A5B68; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>Espace</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C200","options":["#F2C200","#0A5FA3","#1B7A45"]},"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const zumra = { avatarRadius: '10px', avatarBg: '#0E2A3F', avatarFg: '#FFFFFF' };
    const person = { avatarRadius: '999px', avatarBg: '#DCEBF8', avatarFg: '#0A4C85' };
    const posts = [
      Object.assign({}, zumra, {
        badge: "J'ai besoin", badgeBg: '#FCE9D9', badgeFg: '#8A3B00',
        initials: 'GT', author: 'GAMAD Technology', verified: false,
        meta: 'ZUMRA · Technologie · Abidjan · il y a 2 h',
        text: "Nous cherchons une personne qui maîtrise Laravel, deux soirs par semaine, pour avancer sur le site du projet Rahman Technology.",
        hasContext: true, context: 'Projet · Rahman Technology',
        hasFact: false, fact: '',
        primary: 'Je peux aider', hasSecondary: false, secondary: ''
      }),
      Object.assign({}, person, {
        badge: 'Je partage un savoir', badgeBg: '#DDF1E4', badgeFg: '#1B5E33',
        initials: 'AT', author: 'Awa Traoré', verified: false,
        meta: 'Comptabilité · Yamoussoukro · il y a 5 h',
        text: "Atelier ouvert à tous : tenir les comptes d'un petit commerce, d'abord sur un cahier, puis sur téléphone. Samedi à 10 h, en ligne.",
        hasContext: false, context: '',
        hasFact: true, fact: '4 personnes veulent apprendre',
        primary: 'Je veux apprendre', hasSecondary: false, secondary: ''
      }),
      Object.assign({}, zumra, {
        badge: 'Avancée de projet', badgeBg: '#ECE6F8', badgeFg: '#4B2F86',
        initials: 'GT', author: 'GAMAD Technology', verified: false,
        meta: 'ZUMRA · Technologie · Abidjan · hier',
        text: "La maquette du site Rahman Technology est validée par l'équipe. Prochaine étape : mettre en ligne la première version.",
        hasContext: true, context: 'Projet · Rahman Technology · étape 2 franchie',
        hasFact: false, fact: '',
        primary: 'Je soutiens', hasSecondary: true, secondary: 'Je veux participer'
      }),
      Object.assign({}, person, {
        badge: 'Je veux apprendre', badgeBg: '#DCEBF8', badgeFg: '#0A4C85',
        initials: 'MK', author: 'Moussa Koné', verified: false,
        meta: 'Énergie · Bouaké · hier',
        text: "Je veux apprendre à installer et réparer des panneaux solaires. Je suis disponible le week-end.",
        hasContext: false, context: '',
        hasFact: false, fact: '',
        primary: 'Je peux transmettre', hasSecondary: false, secondary: ''
      }),
      Object.assign({}, zumra, {
        badge: 'Appel à rejoindre', badgeBg: '#FBF1C7', badgeFg: '#6B5200',
        initials: 'AB', author: 'Agri Bouaké', verified: true,
        meta: 'ZUMRA · Agriculture · Bouaké · il y a 2 j',
        text: "Notre ZUMRA cultive et transforme le manioc. Nous accueillons des personnes qui veulent apprendre, et d'autres qui savent conduire un tricycle de livraison.",
        hasContext: false, context: '',
        hasFact: false, fact: '',
        primary: 'Je veux rejoindre', hasSecondary: false, secondary: ''
      })
    ];
    return { accent: this.props.accent ?? '#F2C200', posts: posts };
  }
}
</script>
</body>
</html>
